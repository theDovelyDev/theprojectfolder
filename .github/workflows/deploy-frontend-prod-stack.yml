# PURPOSE: Deploys CloudFormation stack for production portfolio site
# TRIGGER: Push to main branch when infrastructure files change
# MAINTAINS: theprojectfolder.com CloudFormation stack
name: Deploy Frontend Prod Stack

on:
  push:
     branches: [main]
     paths:
      - 'cloudresumechallenge/infrastructure/frontend-stack-prod.yaml'
      - '.github/workflows/deploy-frontend-prod-stack.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to CloudFormation (Prod)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials for GitHub Actions (Prod)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsProdRole
          aws-region: us-east-1

      - name: Deploy frontend-stack-prod
        run: |
          aws cloudformation deploy \
            --stack-name frontend-stack-prod \
            --template-file ./cloudresumechallenge/infrastructure/frontend-stack-prod.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset