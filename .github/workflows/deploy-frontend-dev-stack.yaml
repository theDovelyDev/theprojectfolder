name: Deploy Dev Frontend Stack
# PURPOSE: Deploys CloudFormation stack for dev portfolio site
# TRIGGER: Push to dev branch when infrastructure files change
# MAINTAINS: dev.theprojectfolder.com CloudFormation stack

on:
  push:
    branches:
      - dev
    paths:
      - 'cloudresumechallenge/infrastructure/frontend-stack-dev.yaml'
      - '.github/workflows/deploy-frontend-dev-stack.yaml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy frontend-stack-dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::102587257710:role/GitHubActionsDevRole
          aws-region: us-east-1

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file ./cloudresumechallenge/infrastructure/frontend-stack-dev.yaml \
            --stack-name frontend-stack-dev \
            --capabilities CAPABILITY_NAMED_IAM
